name: LUJ1 native glyph regression
on:
  push:
    paths:
      - 'experiments/joint_glyphs/native/**'
      - 'experiments/joint_glyphs/planner/planner.luj'
      - '.github/workflows/luj-native.yml'
  pull_request:
    paths:
      - 'experiments/joint_glyphs/native/**'
      - 'experiments/joint_glyphs/planner/planner.luj'
      - '.github/workflows/luj-native.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build C++17 native glyph decoder
        run: make -C experiments/joint_glyphs/native CXXFLAGS='-O2 -std=c++17 -Wall -Wextra -Werror'
      - name: Execute native corruption and semantic regression suite
        run: make -C experiments/joint_glyphs/native regression
