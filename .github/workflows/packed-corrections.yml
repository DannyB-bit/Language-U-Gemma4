name: Packed correction correctness

on:
  push:
    paths:
      - 'experiments/packed_corrections/**'
      - 'tests/test_packed_corrections.py'
      - 'experiments/joint_glyphs/**'
      - 'tests/test_joint_glyphs.py'
      - '.github/workflows/packed-corrections.yml'
  pull_request:
    paths:
      - 'experiments/packed_corrections/**'
      - 'tests/test_packed_corrections.py'
      - 'experiments/joint_glyphs/**'
      - 'tests/test_joint_glyphs.py'
      - '.github/workflows/packed-corrections.yml'

permissions:
  contents: read

jobs:
  correction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/packed_corrections/requirements.txt
      - name: Offline stored arithmetic and malformed-file checks
        run: |
          python -m unittest discover -s tests -p test_packed_corrections.py -v
          python -m unittest discover -s tests -p test_joint_glyphs.py -v
