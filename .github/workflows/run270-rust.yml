name: Gemma3 270M Rust runtime and codec CI
on:
  push:
    paths:
      - 'experiments/run270_rust/**'
      - '.github/workflows/run270-rust.yml'
  pull_request:
    paths:
      - 'experiments/run270_rust/**'
      - '.github/workflows/run270-rust.yml'
permissions:
  contents: read
jobs:
  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure Rust toolchain is available
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y rustc cargo
          fi
          rustc --version
          cargo --version
      - name: Run unit tests (release)
        run: cargo test --manifest-path experiments/run270_rust/Cargo.toml --release
      - name: Build release binaries with warnings as errors
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --manifest-path experiments/run270_rust/Cargo.toml --release --bins
