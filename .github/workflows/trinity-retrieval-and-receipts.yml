name: Trinity Retrieval, Lean 4 Formal Spec & Receipt Parity CI

on:
  push:
    paths:
      - 'trinity_retrieval/**'
      - 'tests/**'
      - 'neon_runner/container_sniff.py'
      - 'scripts/verify_receipt_parity.py'
      - 'experiments/run270_rust/**'
      - 'experiments/joint_glyphs/evidence/**'
      - 'docs/**'
      - 'README.md'
      - 'agent/**'
      - '.github/workflows/trinity-retrieval-and-receipts.yml'
  pull_request:
    paths:
      - 'trinity_retrieval/**'
      - 'tests/**'
      - 'neon_runner/container_sniff.py'
      - 'scripts/verify_receipt_parity.py'
      - 'experiments/run270_rust/**'
      - 'experiments/joint_glyphs/evidence/**'
      - 'docs/**'
      - 'README.md'
      - 'agent/**'
      - '.github/workflows/trinity-retrieval-and-receipts.yml'

permissions:
  contents: read

jobs:
  retrieval-and-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: trinity_retrieval/formal_verification
          leanchecker: "true"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-pi4.txt
      - name: Run retrieval, Lean-parity, container-sniff, and receipt-parity suites
        run: |
          python -m unittest discover -s tests/retrieval -v
          python -m unittest tests/test_container_sniff.py tests/test_receipt_parity.py -v
          python trinity_retrieval/language_u_octonion.py
          python trinity_retrieval/affine_hadamard_h64.py
          python trinity_retrieval/noise_stability_sieve.py
          python trinity_retrieval/edge_self_test.py
          python neon_runner/container_sniff.py
          python neon_runner/container_sniff.py --verify-hash model/gemma4_e4b_sample_layer0_q_proj.neon_opt4.lanu model/gemma4_e4b_sample_neon_hybrid_v2.lanu model/gemma4_e4b_sample_layer0_q_proj.glyph.bin experiments/joint_glyphs/planner/planner.luj
          python scripts/verify_receipt_parity.py --selftest
          python scripts/verify_receipt_parity.py
      - name: Verify Lean 4 contract files and agent package structure
        run: |
          test -s trinity_retrieval/formal_verification/TrinityGates.lean
          test -s trinity_retrieval/formal_verification/lakefile.toml
          python agent/build.py --check
      - name: Compile-check Python verification and T16C export modules
        run: python -m compileall -q experiments/run270_rust/calib scripts/verify_receipt_parity.py neon_runner/container_sniff.py
