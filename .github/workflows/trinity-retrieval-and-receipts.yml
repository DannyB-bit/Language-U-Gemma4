name: Trinity Retrieval and Receipts CI

on:
  push:
    paths:
      - 'trinity_retrieval/**'
      - 'tests/retrieval/**'
      - 'experiments/run270_rust/calib/**'
      - 'agent/**'
      - '.github/workflows/trinity-retrieval-and-receipts.yml'
  pull_request:
    paths:
      - 'trinity_retrieval/**'
      - 'tests/retrieval/**'
      - 'experiments/run270_rust/calib/**'
      - 'agent/**'
      - '.github/workflows/trinity-retrieval-and-receipts.yml'

permissions:
  contents: read

jobs:
  retrieval-and-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-pi4.txt
      - name: Run retrieval unit tests and standalone contracts
        run: |
          python -m unittest discover -s tests/retrieval -v
          python trinity_retrieval/language_u_octonion.py
          python trinity_retrieval/affine_hadamard_h64.py
          python trinity_retrieval/noise_stability_sieve.py
          python trinity_retrieval/edge_self_test.py
      - name: Verify Lean 4 contract presence and agent package structure
        run: |
          test -s trinity_retrieval/formal_verification/TrinityGates.lean
          python agent/build.py --check
      - name: Compile-check calibration and T16C export scripts
        run: python -m compileall -q experiments/run270_rust/calib
