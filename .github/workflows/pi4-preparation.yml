name: Pi 4 preparation correctness

on:
  push:
    paths:
      - 'neon_runner/**'
      - 'scripts/*pi4*'
      - 'scripts/*31b*'
      - 'tests/test_pi4_barrier.py'
      - 'tests/test_text_runtime.py'
      - 'requirements-pi4*.txt'
      - '.github/workflows/pi4-preparation.yml'
  pull_request:
    paths:
      - 'neon_runner/**'
      - 'scripts/*pi4*'
      - 'scripts/*31b*'
      - 'tests/test_pi4_barrier.py'
      - 'tests/test_text_runtime.py'
      - 'requirements-pi4*.txt'
      - '.github/workflows/pi4-preparation.yml'

permissions:
  contents: read

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pi4.txt
      - name: Build host SIMD library
        run: python neon_runner/build_native.py
      - name: Sample correctness and retrieval math
        run: |
          python -m unittest discover -s tests -p test_pi4_barrier.py -v
          python -m unittest discover -s tests -p test_text_runtime.py -v
          python -m unittest discover -s tests/retrieval -p test_retrieval_math.py -v
      - name: Strict portable C build and parity
        run: |
          mkdir -p pi4-runs
          gcc -O2 -Wall -Wextra -Werror -DNEON_SHARED_LIB_ONLY -shared -fPIC neon_runner/neon_stream_accelerator_v2.c -lm -o pi4-runs/libstrict.so
          gcc -O2 -std=c11 -Wall -Wextra -Werror -shared -fPIC neon_runner/qat_reference.c -o pi4-runs/libqat-strict.so
          LANGU_GEMV_SO="$PWD/pi4-runs/libstrict.so" python -m unittest discover -s tests -p test_pi4_barrier.py -v
          LANGU_QAT_SO="$PWD/pi4-runs/libqat-strict.so" python -m unittest discover -s tests -p test_text_runtime.py -v
      - name: Sample evidence only; this is not a physical Pi 4 proof
        run: python scripts/verify_pi4_preparation.py --report pi4-runs/ci-preparation.json
